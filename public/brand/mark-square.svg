<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Chest Solutions">
  <!-- Flat isometric chest: one hue per face, no gradients. -->

  <!-- ===== LID (flat top) ===== -->
  <path d="M64 34 104 56 64 78 24 56Z" fill="#a99cff"/>
  <!-- lid: front (left) face -->
  <path d="M24 56 64 78v12L24 68Z" fill="#59c6f3"/>
  <!-- lid: side (right) face -->
  <path d="M64 78 104 56v12L64 90Z" fill="#7c6bff"/>

  <!-- ===== BODY ===== -->
  <!-- front (left) face -->
  <path d="M24 68 64 90v28L24 96Z" fill="#3aa8e0"/>
  <!-- side (right) face -->
  <path d="M64 90 104 68v28l-40 22Z" fill="#5a49cc"/>

  <!-- seam between lid and body -->
  <path d="M24 68 64 90 104 68" fill="none" stroke="#ffffff" stroke-opacity="0.28"
        stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ===== small Minecraft-style latch straddling the seam ===== -->
  <path d="M39.6 70.6 48.4 75.4v12l-8.8-4.8Z" fill="#e6ecf7"/>
  <path d="M42.6 76.6 45.4 78.1v4.4l-2.8-1.5Z" fill="#2a2350" fill-opacity="0.5"/>
</svg>
