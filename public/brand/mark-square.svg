<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Chest Solutions">
  <defs>
    <linearGradient id="cs-barrel" x1="46" y1="16" x2="96" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a892ff"/>
      <stop offset="0.5" stop-color="#7fd5ff"/>
      <stop offset="1" stop-color="#45aeea"/>
    </linearGradient>
    <linearGradient id="cs-cap" x1="20" y1="40" x2="64" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a84f5"/>
      <stop offset="1" stop-color="#5b46cf"/>
    </linearGradient>
    <linearGradient id="cs-front" x1="64" y1="58" x2="108" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5cc7f5"/>
      <stop offset="1" stop-color="#2b8fd6"/>
    </linearGradient>
    <linearGradient id="cs-side" x1="20" y1="58" x2="64" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6a55e0"/>
      <stop offset="1" stop-color="#3f30a8"/>
    </linearGradient>
  </defs>

  <!-- ===== body: two visible faces ===== -->
  <path d="M64 80 108 58v26l-44 22Z" fill="url(#cs-front)"/>
  <path d="M64 80 20 58v26l44 22Z" fill="url(#cs-side)"/>

  <!-- ===== lid: half-cylinder swept back-right ===== -->
  <path d="M20 58
           C22 42 32 40 42 42
           C53 44 62 62 64 80
           L108 58
           C106 40 97 22 86 20
           C76 18 66 20 64 36
           Z" fill="url(#cs-barrel)"/>

  <!-- lid near end cap -->
  <path d="M20 58
           C22 42 32 40 42 42
           C53 44 62 62 64 80
           Z" fill="url(#cs-cap)"/>

  <!-- iron band along the lid-body seam -->
  <path d="M20 58 64 80 108 58" fill="none" stroke="#ffffff" stroke-opacity="0.5"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- clasp straddling the seam on the front face -->
  <path d="M83 62 93 57v13l-10 5Z" fill="#eef6ff"/>
</svg>
