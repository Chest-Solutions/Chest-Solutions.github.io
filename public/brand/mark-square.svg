<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Chest Solutions">
  <!-- Flat isometric chest, light-blue palette. The grey latch is extruded
       along the front-face normal so it stands proud of the chest body. -->

  <!-- ===== LID ===== -->
  <path d="M64 34 104 56 64 78 24 56Z" fill="#a9d9ff"/>
  <path d="M24 56 64 78v12L24 68Z" fill="#7cc2fb"/>
  <path d="M64 78 104 56v12L64 90Z" fill="#4aa8f0"/>

  <!-- ===== BODY ===== -->
  <path d="M24 68 64 90v28L24 96Z" fill="#4aa8f0"/>
  <path d="M64 90 104 68v28l-40 22Z" fill="#2f8ad6"/>

  <!-- lid / body seam -->
  <path d="M24 68 64 90 104 68" fill="none" stroke="#0b131d" stroke-opacity="0.25"
        stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- shadow the raised latch casts back onto the chest -->
  <path d="M42.8 66.6 51.599999999999994 71.39999999999999 51.599999999999994 83.39999999999999 42.8 78.6Z" fill="#0b131d" fill-opacity="0.22"/>

  <!-- ===== LATCH (raised) ===== -->
  <!-- extrusion side walls -->
  <path d="M41.0 65.0 49.8 69.8 42.79 73.66 33.99 68.86Z" fill="#f6f9fc"/>
  <path d="M49.8 69.8 49.8 81.8 42.79 85.66 42.79 73.66Z" fill="#8ea3ba"/>
  <path d="M41.0 77.0 49.8 81.8 42.79 85.66 33.99 80.86Z" fill="#7b8ea3"/>
  <!-- raised face plate -->
  <path d="M33.99 68.86 42.79 73.66 42.79 85.66 33.99 80.86Z" fill="#e7eef7"/>
  <!-- keyhole -->
  <path d="M36.99 71.36 39.79 72.86 39.79 77.26 36.99 75.76Z" fill="#0b131d" fill-opacity="0.55"/>
</svg>
