<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Chest Solutions">
  <defs>
    <linearGradient id="cs-lid" x1="14" y1="24" x2="96" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a58cff"/>
      <stop offset="1" stop-color="#62d0ff"/>
    </linearGradient>
    <linearGradient id="cs-body" x1="14" y1="62" x2="96" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f5df0"/>
      <stop offset="1" stop-color="#2fa8e8"/>
    </linearGradient>
    <linearGradient id="cs-side" x1="94" y1="30" x2="116" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5647d6"/>
      <stop offset="1" stop-color="#1f7fb8"/>
    </linearGradient>
    <mask id="cs-cut">
      <rect width="128" height="128" fill="#fff"/>
      <rect x="0" y="58.5" width="128" height="7.5" fill="#000"/>
      <rect x="48" y="50" width="22" height="26" rx="7" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#cs-cut)">
    <!-- back/right depth plane, offset up-right, shares the lid arc -->
    <path d="M30 34c8-5 18-8 29-8 24.3 0 44 10.7 44 24v40a11 11 0 0 1-11 11H74z" fill="url(#cs-side)"/>
    <!-- front lid -->
    <path d="M9 62V50c0-13.3 19.7-24 44-24s44 10.7 44 24v12z" fill="url(#cs-lid)"/>
    <!-- front body -->
    <path d="M9 62h88v29a11 11 0 0 1-11 11H20A11 11 0 0 1 9 91z" fill="url(#cs-body)"/>
  </g>
  <!-- clasp -->
  <rect x="52" y="54" width="14" height="18" rx="4" fill="url(#cs-lid)"/>
</svg>
