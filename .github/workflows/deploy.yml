name: Build and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # GitHub Pages for this repo is configured to serve the main branch
      # (Settings > Pages), so the built site is committed back to the
      # repository root. Identical rebuilds produce no diff, which is what
      # stops this from re-triggering itself forever.
      - name: Commit built site to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Drop hashed bundles from the previous deploy, then lay the new
          # build over the repo root.
          git rm -rq assets 2>/dev/null || true
          cp -a dist/. ./
          git add -A
          if git diff --cached --quiet; then
            echo "Build output unchanged — nothing to deploy."
            exit 0
          fi
          git commit -qm "Deploy VitePress build"
          git push origin HEAD:main
