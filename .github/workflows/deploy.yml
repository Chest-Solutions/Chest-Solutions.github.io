name: Deploy in-dev to /indev

# This file lives on `main`: for push events, GitHub reads workflow files
# from the default branch, so pushes to `in-dev` run this workflow even
# though the file is not in in-dev.
on:
  push:
    branches: ["in-dev"]
  workflow_dispatch:

permissions:
  contents: write

# Separate concurrency group so this never cancels the main site's deploy.
concurrency:
  group: "in-dev"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout in-dev
        uses: actions/checkout@v4
        with:
          ref: in-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # in-dev's App.jsx has no router basename and its build script has no
      # --base flag, so the app would render its 404 page at /indev. Patch
      # the runner's copy only (in-dev and main source stay untouched):
      #  - router basename comes from Vite's BASE_URL (/indev when built
      #    with --base=/indev/, / in the main build)
      #  - logo assets use BASE_URL too, so they load from /indev/
      # The grep check fails loudly if in-dev is ever refactored so the
      # patch no longer applies.
      - name: Patch SPA for /indev (runner copy only)
        run: |
          sed -i 's@<BrowserRouter>@<BrowserRouter basename={import.meta.env.BASE_URL.replace(/\\/$/, "") || "/"}>@' src/App.jsx
          sed -i 's@src="/chest.svg"@src={import.meta.env.BASE_URL + "chest.svg"}@' src/components/Header.jsx src/components/Footer.jsx
          grep -q 'basename=' src/App.jsx

      - name: Build project
        run: |
          npm exec -- vite build --base=/indev/ --outDir dist
          cp -f dist/index.html dist/404.html
