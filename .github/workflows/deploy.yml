name: Build and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Never cancel a run that is already deploying: Pages deployments that get
  # interrupted halfway can leave the environment stuck on the old version.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # VitePress reads git history for `lastUpdated` (enabled in
          # .vitepress/config.mjs); the default shallow clone (depth 1) makes
          # every page report the clone time instead of its real edit date.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # `sharp` (used by vite-plugin-image-optimizer) ships prebuilt native
        # binaries as optional deps, so a plain npm ci resolves them on the
        # runner — no extra system packages needed.
        run: npm ci

      - name: Restore image optimizer cache
        # Where vite-plugin-image-optimizer keeps its compressed copies. It
        # keys them by path, not content, so the directory is content-hashed in
        # .vitepress/config.mjs and this key hashes the images themselves — an
        # edited image always gets recompressed instead of reusing the stale
        # copy. Must run AFTER `npm ci`, which wipes node_modules. A miss only
        # costs ~2s of recompression; the images are optimized either way.
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/vite-plugin-image-optimizer
          key: ${{ runner.os }}-image-optimizer-${{ hashFiles('public/**/*.png', 'public/**/*.jpg', 'public/**/*.jpeg', 'public/**/*.svg', 'public/**/*.webp', 'public/**/*.gif', 'public/**/*.avif') }}
          restore-keys: |
            ${{ runner.os }}-image-optimizer-

      - name: Build project
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy-pages:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
