name: Build and Deploy to GitHub Pages

on:
  push:
    branches: ["main", "in-dev"] # Triggers on both branches
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Dynamically builds with the correct Vite base path based on the branch
      - name: Build project
        run: |
          if [ "${{ github.ref_name }}" = "in-dev" ]; then
            npm run build -- --base=/indev/
          else
            npm run build
          fi

      # Dynamically structures the build files based on the branch
      - name: Prepare deployment folder
        id: prep
        run: |
          if [ "${{ github.ref_name }}" = "in-dev" ]; then
            mkdir -p dist-nested/indev
            cp -r dist/* dist-nested/indev/
            echo "path=./dist-nested" >> $GITHUB_OUTPUT
          else
            echo "path=./dist" >> $GITHUB_OUTPUT
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.prep.outputs.path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
