name: Deploy in-dev build to /indev

# This file lives on `main` on purpose: for `push` events, GitHub runs the
# workflow file from the default branch (main), so this will run every time
# someone pushes to `in-dev` even though the file itself is not in in-dev.
on:
  push:
    branches: ["in-dev"]
  workflow_dispatch:

# We commit the built site back to `main` under `indev/`, because GitHub
# Pages for this repo serves the main branch (files at the repo root).
permissions:
  contents: write

concurrency:
  group: indev-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout in-dev
        uses: actions/checkout@v4
        with:
          ref: in-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # No reliance on scripts defined inside in-dev (e.g. build:indev).
      # This uses the `vite` binary that npm ci just installed, with the
      # /indev base path so every asset URL is served from /indev/.
      - name: Build with /indev base path
        run: |
          npm exec -- vite build --base=/indev/ --outDir dist
          cp -f dist/index.html dist/404.html

      - name: Publish to main under indev/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout -B main origin/main

          # Replace the previous in-dev build with the new one.
          rm -rf indev
          cp -a dist indev

          git add -A indev
          if git diff --cached --quiet; then
            echo "In-dev build unchanged — nothing to publish."
            exit 0
          fi

          git commit -qm "Deploy in-dev build to /indev"
          git push origin main
